# Kids Talk Online - Sıkı Tip ve Kod Kalitesi Kuralları

include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true         # Belirsiz tip dönüşümlerini engeller
    strict-inference: true     # Tipi belli olmayan değişkenlere izin vermez
    strict-raw-types: true     # Liste/Map gibi koleksiyonlarda eleman tipini zorunlu kılar
  errors:
    missing_required_param: error
    missing_return: error
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:
    - always_declare_return_types   # Fonksiyonların ne döneceğini (void, String, int) zorunlu kılar
    - avoid_empty_else
    - avoid_relative_lib_imports
    - await_only_futures
    - camel_case_types
    - cancel_subscriptions          # Bellek sızıntılarını engeller
    - prefer_single_quotes          # Metinlerde tek tırnak ('...') kullanımını standartlaştırır
    - unawaited_futures             # Bekletilmeyen asenkron işlemlerde uyarır
    - use_key_in_widget_constructors # Ekran performansını korur
