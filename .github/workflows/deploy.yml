name: Deploy Flutter Web to Hostinger

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: Build & Deploy to Hostinger
    runs-on: ubuntu-latest

    steps:
      - name: 🛑 Checkout Repo
        uses: actions/checkout@v4

      - name: 💙 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: 📦 Install Dependencies & Build Web
        run: |
          flutter pub get
          flutter build web --release --base-href "/lms/"
          echo '<IfModule mod_rewrite.c>' > build/web/.htaccess
          echo '  RewriteEngine On' >> build/web/.htaccess
          echo '  RewriteBase /lms/' >> build/web/.htaccess
          echo '  RewriteRule ^index\.html$ - [L]' >> build/web/.htaccess
          echo '  RewriteCond %{REQUEST_FILENAME} !-f' >> build/web/.htaccess
          echo '  RewriteCond %{REQUEST_FILENAME} !-d' >> build/web/.htaccess
          echo '  RewriteRule . /lms/index.html [L]' >> build/web/.htaccess
          echo '</IfModule>' >> build/web/.htaccess

      - name: 🚀 FTP Deploy to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: build/web/
          server-dir: lms/
          dangerous-clean-slate: false
