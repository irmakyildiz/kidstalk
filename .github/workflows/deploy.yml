name: Deploy Flutter Web to Hostinger

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: Build & Deploy to Hostinger
    runs-on: ubuntu-latest

    steps:
      - name: 🛑 Checkout Repo
        uses: actions/checkout@v4

      - name: 💙 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: 📦 Install Dependencies & Build Web
        run: |
          flutter pub get
          flutter build web --release --base-href "/lms/" --pwa-strategy=none
          echo '<IfModule mod_rewrite.c>' > build/web/.htaccess
          echo '  RewriteEngine On' >> build/web/.htaccess
          echo '  RewriteBase /lms/' >> build/web/.htaccess
          echo '  RewriteRule ^index\.html$ - [L]' >> build/web/.htaccess
          echo '  RewriteCond %{REQUEST_FILENAME} !-f' >> build/web/.htaccess
          echo '  RewriteCond %{REQUEST_FILENAME} !-d' >> build/web/.htaccess
          echo '  RewriteRule . /lms/index.html [L]' >> build/web/.htaccess
          echo '</IfModule>' >> build/web/.htaccess

      - name: 🚀 FTP Deploy to Hostinger via LFTP
        run: |
          sudo apt-get update && sudo apt-get install -y lftp
          lftp -c "set ftp:ssl-allow no; open -u '${{ secrets.FTP_USERNAME }}','${{ secrets.FTP_PASSWORD }}' '${{ secrets.FTP_SERVER }}'; mirror -R --delete --verbose build/web/ lms/; mirror -R --delete --verbose build/web/ public_html/lms/; mirror -R --delete --verbose build/web/ dodgerblue-ram-159741.hostingersite.com/public_html/lms/"
